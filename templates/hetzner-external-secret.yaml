{{- if and .Values.hetzner (.Capabilities.APIVersions.Has "external-secrets.io/v1/ExternalSecret") }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name hetzner
spec:
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: /{{ .Values.global.stage }}/crossplane/hetzner-minio
        property: AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: /{{ .Values.global.stage }}/crossplane/hetzner-minio
        property: AWS_SECRET_ACCESS_KEY
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: awssm-parameter-store
  target:
    name: *name
{{- end }}
