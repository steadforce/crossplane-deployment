{{- if and .Values.ovh (.Capabilities.APIVersions.Has "aws.upbound.io/v1beta1") }}
apiVersion: aws.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: ovh-s3
spec:
  credentials:
    secretRef:
      key: creds
      name: ovh
      namespace: crossplane-system
    source: Secret
  endpoint:
    hostnameImmutable: true
    # explicit partition lets the provider tolerate the non-AWS region "de"
    partitionId: aws
    services:
    - s3
    signingName: s3
    signingRegion: de
    source: Custom
    url:
      static: {{ .Values.ovh.s3.endpoint }}
      type: Static
  s3_use_path_style: true
  skip_credentials_validation: true
  skip_region_validation: true
  skip_requesting_account_id: true
{{ end }}
