suite: minio Provider package per cluster
capabilities:
  apiVersions:
    - pkg.crossplane.io/v1
templates:
  - templates/minio-s3-provider.yaml
release:
  name: crossplane
tests:
  - it: renders nothing on local without ovh or hetzner values
    values:
      - &subchartOverrideValuesFile ../values-subchart-overrides.yaml
      - ../values-local.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing in development without ovh or hetzner values
    values:
      - *subchartOverrideValuesFile
      - ../values-development.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing in production without ovh or hetzner values
    values:
      - *subchartOverrideValuesFile
      - ../values-production.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: installs the vshn provider-minio package on sf-k8s04-dev for ovh
    values:
      - *subchartOverrideValuesFile
      - ../values-development.yaml
      - ../values-sf-k8s04-dev.yaml
    asserts: &minioProviderAssert
      - equal:
          path: apiVersion
          value: pkg.crossplane.io/v1
      - equal:
          path: kind
          value: Provider
      - equal:
          path: metadata.name
          value: provider-minio
      - equal:
          path: spec.package
          value: xpkg.upbound.io/vshn/provider-minio:v0.4.5
      - equal:
          path: spec.runtimeConfigRef.name
          value: minio-provider
      - matchSnapshot: {}

  - it: installs the vshn provider-minio package on sf-k8s03-dev for hetzner
    values:
      - *subchartOverrideValuesFile
      - ../values-development.yaml
      - ../values-sf-k8s03-dev.yaml
    asserts: *minioProviderAssert
