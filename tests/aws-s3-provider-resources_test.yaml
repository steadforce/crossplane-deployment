suite: aws-s3-provider DeploymentRuntimeConfig resources per stage
capabilities:
  apiVersions:
  - pkg.crossplane.io/v1beta1
templates:
- templates/aws-s3-provider-runtime-config.yaml
release:
  name: crossplane
tests:
- it: renders nothing on sf-k8s04-dev where aws s3 is disabled
  values:
  - &subchartOverrideValuesFile ../values-subchart-overrides.yaml
  - ../values-development.yaml
  - ../values-sf-k8s04-dev.yaml
  asserts:
  - hasDocuments:
      count: 0
- it: uses zero cpu and memory requests and a zero cpu limit for aws-s3-provider on local
  values:
  - *subchartOverrideValuesFile
  - ../values-local.yaml
  asserts:
  - matchRegex:
      path: spec.deploymentTemplate.spec.template.spec.containers[?(@.name == "package-runtime")].resources.limits.cpu
      # on local cluster we expect 0 or 0m cpu limits
      pattern: "^0.*"
  - matchRegex:
      path: spec.deploymentTemplate.spec.template.spec.containers[?(@.name == "package-runtime")].resources.limits.memory
      # on local cluster we expect non 0 memory limits
      pattern: "^[1-9].*"
  - matchRegex:
      path: spec.deploymentTemplate.spec.template.spec.containers[?(@.name == "package-runtime")].resources.requests.cpu
      # on local cluster we expect 0 or 0m cpu requests
      pattern: "^0.*"
  - matchRegex:
      path: spec.deploymentTemplate.spec.template.spec.containers[?(@.name == "package-runtime")].resources.requests.memory
      # on local cluster we expect 0 or 0Mi 0Gi memory requests
      pattern: "^0.*"
  - matchSnapshot: {}

- it: sets non-zero cpu and memory requests and limits for aws-s3-provider in development
  values:
  - *subchartOverrideValuesFile
  - ../values-development.yaml
  asserts: &awsS3ProviderResourcesAssert
  - matchRegex:
      path: spec.deploymentTemplate.spec.template.spec.containers[?(@.name == "package-runtime")].resources.limits.cpu
      # on local cluster we expect non 0 cpu limits
      pattern: "^[1-9].*"
  - matchRegex:
      path: spec.deploymentTemplate.spec.template.spec.containers[?(@.name == "package-runtime")].resources.limits.memory
      # on local cluster we expect non 0 memory limits
      pattern: "^[1-9].*"
  - matchRegex:
      path: spec.deploymentTemplate.spec.template.spec.containers[?(@.name == "package-runtime")].resources.requests.cpu
      # on local cluster we expect non 0 cpu requests
      pattern: "^[1-9].*"
  - matchRegex:
      path: spec.deploymentTemplate.spec.template.spec.containers[?(@.name == "package-runtime")].resources.requests.memory
      # on local cluster we expect non 0 memory requests
      pattern: "^[1-9].*"
  - matchSnapshot: {}

- it: sets non-zero cpu and memory requests and limits for aws-s3-provider in production
  values:
  - *subchartOverrideValuesFile
  - ../values-production.yaml
  asserts: *awsS3ProviderResourcesAssert

- it: sets the raised aws-s3-provider memory limit in development
  values:
  - *subchartOverrideValuesFile
  - ../values-development.yaml
  asserts: &awsS3ProviderMemoryLimitAssert
  - equal:
      path: spec.deploymentTemplate.spec.template.spec.containers[?(@.name == "package-runtime")].resources.limits.memory
      value: 512Mi

- it: sets the raised aws-s3-provider memory limit in production
  values:
  - *subchartOverrideValuesFile
  - ../values-production.yaml
  asserts: *awsS3ProviderMemoryLimitAssert
