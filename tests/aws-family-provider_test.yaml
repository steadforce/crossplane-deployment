suite: aws family Provider package
capabilities:
  apiVersions:
  - pkg.crossplane.io/v1
templates:
- templates/aws-family-provider.yaml
release:
  name: crossplane
tests:
- it: renders nothing on sf-k8s04-dev where aws s3 is disabled
  values:
  - &subchartOverrideValuesFile ../values-subchart-overrides.yaml
  - ../values-development.yaml
  - ../values-sf-k8s04-dev.yaml
  asserts:
  - hasDocuments:
      count: 0
- it: uses the upbound provider-family-aws package
  values:
  - *subchartOverrideValuesFile
  - ../values-local.yaml
  asserts:
  - matchRegex:
      path: spec.package
      pattern: "^xpkg.upbound.io/upbound/provider-family-aws:"
  - matchSnapshot: {}
- it: adopts the name of the auto-installed family provider dependency
  values:
  - *subchartOverrideValuesFile
  - ../values-local.yaml
  asserts:
  - equal:
      path: metadata.name
      value: upbound-provider-family-aws
