suite: test if the resource settings for crossplane and rbac-manager containers in cluster is correct
templates:
- charts/crossplane/templates/deployment.yaml
- charts/crossplane/templates/rbac-manager-deployment.yaml
release:
  name: crossplane
tests:
- it: crossplane container resources for local cluster
  values:
  - &subchartOverrideValuesFile ../values-subchart-overrides.yaml
  - ../values-local.yaml
  asserts:
  - template: charts/crossplane/templates/deployment.yaml
    matchRegex:
      path: spec.template.spec.containers[?(@.name == "crossplane")].resources.limits.cpu
      # on local cluster we expect 0 or 0m cpu limits
      pattern: "^0.*"
  - template: charts/crossplane/templates/deployment.yaml
    matchRegex:
      path: spec.template.spec.containers[?(@.name == "crossplane")].resources.limits.memory
      # on local cluster we expect non 0 memory limits
      pattern: "^[1-9].*"
  - template: charts/crossplane/templates/deployment.yaml
    matchRegex:
      path: spec.template.spec.containers[?(@.name == "crossplane")].resources.requests.cpu
      # on local cluster we expect 0 or 0m cpu requests
      pattern: "^0.*"
  - template: charts/crossplane/templates/deployment.yaml
    matchRegex:
      path: spec.template.spec.containers[?(@.name == "crossplane")].resources.requests.memory
      # on local cluster we expect 0 or 0Mi 0Gi memory requests
      pattern: "^0.*"
  - template: charts/crossplane/templates/deployment.yaml
    matchSnapshot: {}

- it: crossplane container resources for dev-cloud01 cluster
  values:
  - *subchartOverrideValuesFile
  - ../values-development.yaml
  asserts: &crossplaneResourcesAsserts
  - template: charts/crossplane/templates/deployment.yaml
    matchRegex:
      path: spec.template.spec.containers[?(@.name == "crossplane")].resources.limits.cpu
      # on local cluster we expect non 0 cpu limits
      pattern: "^[1-9].*"
  - template: charts/crossplane/templates/deployment.yaml
    matchRegex:
      path: spec.template.spec.containers[?(@.name == "crossplane")].resources.limits.memory
      # on local cluster we expect non 0 memory limits
      pattern: "^[1-9].*"
  - template: charts/crossplane/templates/deployment.yaml
    matchRegex:
      path: spec.template.spec.containers[?(@.name == "crossplane")].resources.requests.cpu
      # on local cluster we expect non 0 cpu requests
      pattern: "^[1-9].*"
  - template: charts/crossplane/templates/deployment.yaml
    matchRegex:
      path: spec.template.spec.containers[?(@.name == "crossplane")].resources.requests.memory
      # on local cluster we expect non 0 memory requests
      pattern: "^[1-9].*"
  - template: charts/crossplane/templates/deployment.yaml
    matchSnapshot: {}

- it: crossplane container resources for prod-cloud01 cluster
  values:
  - *subchartOverrideValuesFile
  - ../values-production.yaml
  asserts: *crossplaneResourcesAsserts

- it: rbac-manager container resources for local cluster
  values:
  - *subchartOverrideValuesFile
  - ../values-local.yaml
  asserts:
  - template: charts/crossplane/templates/rbac-manager-deployment.yaml
    matchRegex:
      path: spec.template.spec.containers[?(@.name == "crossplane")].resources.limits.cpu
      # on local cluster we expect 0 or 0m cpu limits
      pattern: "^0.*"
  - template: charts/crossplane/templates/rbac-manager-deployment.yaml
    matchRegex:
      path: spec.template.spec.containers[?(@.name == "crossplane")].resources.limits.memory
      # on local cluster we expect non 0 memory limits
      pattern: "^[1-9].*"
  - template: charts/crossplane/templates/rbac-manager-deployment.yaml
    matchRegex:
      path: spec.template.spec.containers[?(@.name == "crossplane")].resources.requests.cpu
      # on local cluster we expect 0 or 0m cpu requests
      pattern: "^0.*"
  - template: charts/crossplane/templates/rbac-manager-deployment.yaml
    matchRegex:
      path: spec.template.spec.containers[?(@.name == "crossplane")].resources.requests.memory
      # on local cluster we expect 0 or 0Mi 0Gi memory requests
      pattern: "^0.*"
  - template: charts/crossplane/templates/rbac-manager-deployment.yaml
    matchSnapshot: {}

- it: rbac-manager container resources for dev-cloud01 cluster
  values:
  - *subchartOverrideValuesFile
  - ../values-development.yaml
  asserts: &rbacManagerResourcesAsserts
  - template: charts/crossplane/templates/rbac-manager-deployment.yaml
    matchRegex:
      path: spec.template.spec.containers[?(@.name == "crossplane")].resources.limits.cpu
      # on local cluster we expect non 0 cpu limits
      pattern: "^[1-9].*"
  - template: charts/crossplane/templates/rbac-manager-deployment.yaml
    matchRegex:
      path: spec.template.spec.containers[?(@.name == "crossplane")].resources.limits.memory
      # on local cluster we expect non 0 memory limits
      pattern: "^[1-9].*"
  - template: charts/crossplane/templates/rbac-manager-deployment.yaml
    matchRegex:
      path: spec.template.spec.containers[?(@.name == "crossplane")].resources.requests.cpu
      # on local cluster we expect non 0 cpu requests
      pattern: "^[1-9].*"
  - template: charts/crossplane/templates/rbac-manager-deployment.yaml
    matchRegex:
      path: spec.template.spec.containers[?(@.name == "crossplane")].resources.requests.memory
      # on local cluster we expect non 0 memory requests
      pattern: "^[1-9].*"
  - template: charts/crossplane/templates/rbac-manager-deployment.yaml
    matchSnapshot: {}

- it: rbac-manager container resources for prod-cloud01 cluster
  values:
  - *subchartOverrideValuesFile
  - ../values-production.yaml
  asserts: *rbacManagerResourcesAsserts
