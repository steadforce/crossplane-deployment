suite: minio provider DeploymentRuntimeConfig resources for ovh
templates:
  - templates/minio-s3-provider-runtime-config.yaml
release:
  name: crossplane
values:
  - ../values-subchart-overrides.yaml
tests:
  - it: renders nothing on local without ovh values
    capabilities:
      apiVersions: []
    values:
      - ../values-local.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing in development without ovh values
    capabilities:
      apiVersions: []
    values:
      - ../values-development.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing in production without ovh values
    capabilities:
      apiVersions: []
    values:
      - ../values-production.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: sets non-zero cpu and memory requests and limits for the minio provider on sf-k8s04-dev
    capabilities:
      apiVersions:
        - pkg.crossplane.io/v1beta1
    values:
      - ../values-development.yaml
      - ../values-sf-k8s04-dev.yaml
    asserts:
      # on sf-k8s04-dev cluster we expect non 0 cpu, memory limits & requests
      - matchRegex:
          path: spec.deploymentTemplate.spec.template.spec.containers[?(@.name == "package-runtime")].resources.limits.cpu
          pattern: "^[1-9].*"
      - matchRegex:
          path: spec.deploymentTemplate.spec.template.spec.containers[?(@.name == "package-runtime")].resources.limits.memory
          pattern: "^[1-9].*"
      - matchRegex:
          path: spec.deploymentTemplate.spec.template.spec.containers[?(@.name == "package-runtime")].resources.requests.cpu
          pattern: "^[1-9].*"
      - matchRegex:
          path: spec.deploymentTemplate.spec.template.spec.containers[?(@.name == "package-runtime")].resources.requests.memory
          pattern: "^[1-9].*"
      - matchSnapshot: {}
