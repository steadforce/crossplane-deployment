suite: ovh-s3 minio ProviderConfig per cluster
templates:
  - templates/ovh-s3-provider-config.yaml
release:
  name: crossplane
tests:
  - it: renders nothing on local without ovh values
    capabilities: &noApiVersionsCapabilities
      apiVersions: []
    values:
      - &subchartOverrideValuesFile ../values-subchart-overrides.yaml
      - ../values-local.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing in development without ovh values
    capabilities: *noApiVersionsCapabilities
    values:
      - *subchartOverrideValuesFile
      - ../values-development.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing in production without ovh values
    capabilities: *noApiVersionsCapabilities
    values:
      - *subchartOverrideValuesFile
      - ../values-production.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the ovh-s3 minio ProviderConfig on sf-k8s04-dev
    capabilities: &minioProviderCapabilities
      apiVersions:
        - minio.crossplane.io/v1
    values: &sfK8s04DevValues
      - *subchartOverrideValuesFile
      - ../values-development.yaml
      - ../values-sf-k8s04-dev.yaml
    asserts:
      - equal:
          path: apiVersion
          value: minio.crossplane.io/v1
      - equal:
          path: kind
          value: ProviderConfig
      - equal:
          path: metadata.name
          value: ovh-s3
      - matchSnapshot: {}

  - it: reads credentials from a Secret
    capabilities: *minioProviderCapabilities
    values: *sfK8s04DevValues
    asserts:
      - equal:
          path: spec.credentials.source
          value: Secret

  - it: references the ovh secret in crossplane-system
    capabilities: *minioProviderCapabilities
    values: *sfK8s04DevValues
    asserts:
      - equal:
          path: spec.credentials.apiSecretRef.name
          value: ovh
      - equal:
          path: spec.credentials.apiSecretRef.namespace
          value: crossplane-system

  - it: points at the ovh de object storage endpoint
    capabilities: *minioProviderCapabilities
    values: *sfK8s04DevValues
    asserts:
      - equal:
          path: spec.minioURL
          value: https://s3.de.io.cloud.ovh.net
