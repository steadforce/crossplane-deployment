suite: test if values for ovh s3 provider config are correct
templates:
  - templates/ovh-s3-provider-config.yaml
release:
  name: crossplane
tests:
  - it: ovh s3 provider config is not rendered for local cluster
    capabilities:
      apiVersions: []
    values:
      - ../values-subchart-overrides.yaml
      - ../values-local.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: ovh s3 provider config is not rendered for development cluster without ovh values
    capabilities:
      apiVersions: []
    values:
      - ../values-subchart-overrides.yaml
      - ../values-development.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: ovh s3 provider config is not rendered for production cluster
    capabilities:
      apiVersions: []
    values:
      - ../values-subchart-overrides.yaml
      - ../values-production.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: ovh s3 provider config for sf-k8s04-dev cluster
    capabilities:
      apiVersions:
        - minio.crossplane.io/v1
    values:
      - ../values-subchart-overrides.yaml
      - ../values-development.yaml
      - ../values-sf-k8s04-dev.yaml
    asserts:
      - equal:
          path: apiVersion
          value: minio.crossplane.io/v1
      - equal:
          path: kind
          value: ProviderConfig
      - equal:
          path: metadata.name
          value: ovh-s3
      - matchSnapshot: {}

  - it: ovh s3 provider config uses Secret credentials
    capabilities:
      apiVersions:
        - minio.crossplane.io/v1
    values:
      - ../values-subchart-overrides.yaml
      - ../values-development.yaml
      - ../values-sf-k8s04-dev.yaml
    asserts:
      - equal:
          path: spec.credentials.source
          value: Secret

  - it: ovh s3 provider config references the ovh API secret
    capabilities:
      apiVersions:
        - minio.crossplane.io/v1
    values:
      - ../values-subchart-overrides.yaml
      - ../values-development.yaml
      - ../values-sf-k8s04-dev.yaml
    asserts:
      - equal:
          path: spec.credentials.apiSecretRef.name
          value: ovh
      - equal:
          path: spec.credentials.apiSecretRef.namespace
          value: crossplane-system

  - it: ovh s3 provider config uses the correct endpoint
    capabilities:
      apiVersions:
        - minio.crossplane.io/v1
    values:
      - ../values-subchart-overrides.yaml
      - ../values-development.yaml
      - ../values-sf-k8s04-dev.yaml
    asserts:
      - equal:
          path: spec.minioURL
          value: https://s3.de.io.cloud.ovh.net
