suite: test if values for ovh s3 provider config are correct

templates:
  - templates/ovh-s3-provider-config.yaml

release:
  name: crossplane

tests:
  - it: ovh s3 provider config is not rendered for local cluster
    capabilities:
      apiVersions: []
    values:
      - ../values-subchart-overrides.yaml
      - ../values-local.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: ovh s3 provider config is not rendered for development cluster without ovh values
    capabilities:
      apiVersions: []
    values:
      - ../values-subchart-overrides.yaml
      - ../values-development.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: ovh s3 provider config is not rendered for production cluster
    capabilities:
      apiVersions: []
    values:
      - ../values-subchart-overrides.yaml
      - ../values-production.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: ovh s3 provider config for sf-k8s04-dev cluster
    capabilities:
      apiVersions:
        - minio.crossplane.io/v1
    values:
      - ../values-subchart-overrides.yaml
      - ../values-development.yaml
      - ../values-sf-k8s04-dev.yaml
    asserts:
      - equal:
          path: apiVersion
          value: minio.crossplane.io/v1
      - equal:
          path: kind
          value: ProviderConfig
      - equal:
          path: metadata.name
          value: ovh-s3
      - equal:
          path: spec.minioURL
          value: https://s3.de.io.cloud.ovh.net
      - matchSnapshot: {}

  - it: ovh s3 provider config references the ovh secret
    capabilities:
      apiVersions:
        - minio.crossplane.io/v1
    values:
      - ../values-subchart-overrides.yaml
      - ../values-development.yaml
      - ../values-sf-k8s04-dev.yaml
    asserts:
      - equal:
          path: spec.credentials
          value:
            secretRef:
              key: creds
              name: ovh
              namespace: crossplane-system
            source: Secret
