suite: test if the settings for the ionos-external-secret are correct
release:
  name: external-secrets
templates:
  - templates/ionos-external-secret.yaml
values:
  - ../values-subchart-overrides.yaml
tests:
  - it: ionos external secret is not rendered for local cluster
    capabilities: &noApiVersionsCapabilities
      apiVersions: []
    values:
      - ../values-local.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: ionos external secret is not rendered for development cluster without ionos values
    capabilities: *noApiVersionsCapabilities
    values:
      - ../values-development.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: ionos external secret is not rendered for production cluster
    capabilities: *noApiVersionsCapabilities
    values:
      - ../values-production.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: snapshot test for detecting side effects on ionos-external-secret during local development
    capabilities: &externalSecretCapabilities
      apiVersions:
        - external-secrets.io/v1/ExternalSecret
    values: &sfk8s05DevValues
      - ../values-development.yaml
      - ../values-sf-k8s05-dev.yaml
    asserts:
      - matchSnapshot: {}

  - it: target secret name is set to the name of ionos secret
    capabilities: *externalSecretCapabilities
    values: *sfk8s05DevValues
    asserts:
      - equal:
          path: spec.target.name
          value: ionos

  - it: refresh interval is set to one hour
    capabilities: *externalSecretCapabilities
    values: *sfk8s05DevValues
    asserts:
      - equal:
          path: spec.refreshInterval
          value: 1h

  - it: secret store reference is set to awssm-parameter-store
    capabilities: *externalSecretCapabilities
    values: *sfk8s05DevValues
    asserts:
      - equal:
          path: spec.secretStoreRef
          value:
            kind: ClusterSecretStore
            name: awssm-parameter-store

  - it: data for sf-k8s05-dev cluster is referencing the correct key(s)
    capabilities: *externalSecretCapabilities
    values: *sfk8s05DevValues
    asserts:
      - equal:
          path: spec.data
          value:
            - secretKey: AWS_ACCESS_KEY_ID
              remoteRef:
                key: /development/crossplane/ionos
                property: AWS_ACCESS_KEY_ID
            - secretKey: AWS_SECRET_ACCESS_KEY
              remoteRef:
                key: /development/crossplane/ionos
                property: AWS_SECRET_ACCESS_KEY