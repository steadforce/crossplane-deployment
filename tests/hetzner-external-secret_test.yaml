suite: test if the settings for the hetzner-external-secret are correct
release:
  name: external-secrets

templates:
  - templates/hetzner-external-secret.yaml

tests:
  - it: hetzner external secret is not rendered for local cluster
    capabilities: &noApiVersionsCapabilities
      apiVersions: []
    values:
      - &subchartOverrideValuesFile ../values-subchart-overrides.yaml
      - ../values-local.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: hetzner external secret is not rendered for development cluster without hetzner values
    capabilities: *noApiVersionsCapabilities
    values:
      - *subchartOverrideValuesFile
      - ../values-development.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: hetzner external secret is not rendered for production cluster
    capabilities: *noApiVersionsCapabilities
    values:
      - *subchartOverrideValuesFile
      - ../values-production.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: snapshot test for detecting side effects on hetzner-external-secret during local development
    capabilities: &externalSecretCapabilities
      apiVersions:
        - external-secrets.io/v1/ExternalSecret
    values: &sfK8s03DevValues
      - *subchartOverrideValuesFile
      - ../values-development.yaml
      - ../values-sf-k8s03-dev.yaml
    asserts:
      - matchSnapshot: {}

  - it: target secret name is set to the name of hetzner secret
    capabilities: *externalSecretCapabilities
    values: *sfK8s03DevValues
    asserts:
      - equal:
          path: spec.target.name
          value: hetzner

  - it: refresh interval is set to one hour
    capabilities: *externalSecretCapabilities
    values: *sfK8s03DevValues
    asserts:
      - equal:
          path: spec.refreshInterval
          value: 1h

  - it: secret store reference is set to awssm-parameter-store
    capabilities: *externalSecretCapabilities
    values: *sfK8s03DevValues
    asserts:
      - equal:
          path: spec.secretStoreRef
          value:
            kind: ClusterSecretStore
            name: awssm-parameter-store

  - it: data for sf-k8s03-dev cluster is referencing the correct key(s)
    capabilities: *externalSecretCapabilities
    values: *sfK8s03DevValues
    asserts:
      - equal:
          path: spec.data
          value:
            - secretKey: AWS_ACCESS_KEY_ID
              remoteRef:
                key: /development/crossplane/hetzner
                property: AWS_ACCESS_KEY_ID
            - secretKey: AWS_SECRET_ACCESS_KEY
              remoteRef:
                key: /development/crossplane/hetzner
                property: AWS_SECRET_ACCESS_KEY