suite: aws credentials ExternalSecret per stage
capabilities:
  apiVersions:
  - external-secrets.io/v1/ExternalSecret
release:
  name: external-secrets
templates:
- templates/aws-external-secret.yaml
tests:
- it: renders nothing on sf-k8s04-dev where aws s3 is disabled
  values:
  - &subchartOverrideValuesFile ../values-subchart-overrides.yaml
  - ../values-development.yaml
  - ../values-sf-k8s04-dev.yaml
  asserts:
  - hasDocuments:
      count: 0
- it: matches the default values snapshot
  asserts:
  - matchSnapshot: {}
- it: sets the target secret name to aws
  asserts:
  - equal:
      path: spec.target.name
      value: aws
- it: sets the refresh interval to one hour
  asserts:
  - equal:
      path: spec.refreshInterval
      value: 1h
- it: references the awssm-parameter-store cluster secret store
  asserts:
  - equal:
      path: spec.secretStoreRef
      value:
        kind: ClusterSecretStore
        name: awssm-parameter-store
- it: reads the creds key from /local/crossplane/aws on local
  values:
  - *subchartOverrideValuesFile
  - ../values-local.yaml
  asserts:
  - equal:
      path: spec.data
      value:
      - secretKey: creds
        remoteRef:
          key: /local/crossplane/aws
- it: reads the creds key from /development/crossplane/aws in development
  values:
  - *subchartOverrideValuesFile
  - ../values-development.yaml
  asserts:
  - equal:
      path: spec.data
      value:
      - secretKey: creds
        remoteRef:
          key: /development/crossplane/aws
- it: reads the creds key from /production/crossplane/aws in production
  values:
  - *subchartOverrideValuesFile
  - ../values-production.yaml
  asserts:
  - equal:
      path: spec.data
      value:
      - secretKey: creds
        remoteRef:
          key: /production/crossplane/aws
