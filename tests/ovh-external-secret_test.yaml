suite: ovh credentials ExternalSecret per cluster
release:
  name: external-secrets

templates:
  - templates/ovh-external-secret.yaml

tests:
  - it: renders nothing on local without ovh values
    capabilities: &noApiVersionsCapabilities
      apiVersions: []
    values:
      - &subchartOverrideValuesFile ../values-subchart-overrides.yaml
      - ../values-local.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing in development without ovh values
    capabilities: *noApiVersionsCapabilities
    values:
      - *subchartOverrideValuesFile
      - ../values-development.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing in production without ovh values
    capabilities: *noApiVersionsCapabilities
    values:
      - *subchartOverrideValuesFile
      - ../values-production.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: matches the sf-k8s04-dev snapshot
    capabilities: &externalSecretCapabilities
      apiVersions:
        - external-secrets.io/v1/ExternalSecret
    values: &sfK8s04DevValues
      - *subchartOverrideValuesFile
      - ../values-development.yaml
      - ../values-sf-k8s04-dev.yaml
    asserts:
      - matchSnapshot: {}

  - it: sets the target secret name to ovh
    capabilities: *externalSecretCapabilities
    values: *sfK8s04DevValues
    asserts:
      - equal:
          path: spec.target.name
          value: ovh

  - it: sets the refresh interval to one hour
    capabilities: *externalSecretCapabilities
    values: *sfK8s04DevValues
    asserts:
      - equal:
          path: spec.refreshInterval
          value: 1h

  - it: references the awssm-parameter-store cluster secret store
    capabilities: *externalSecretCapabilities
    values: *sfK8s04DevValues
    asserts:
      - equal:
          path: spec.secretStoreRef
          value:
            kind: ClusterSecretStore
            name: awssm-parameter-store

  - it: reads both s3 keys from /development/crossplane/ovh-minio on sf-k8s04-dev
    capabilities: *externalSecretCapabilities
    values: *sfK8s04DevValues
    asserts:
      - equal:
          path: spec.data
          value:
            - secretKey: AWS_ACCESS_KEY_ID
              remoteRef:
                key: /development/crossplane/ovh-minio
                property: AWS_ACCESS_KEY_ID
            - secretKey: AWS_SECRET_ACCESS_KEY
              remoteRef:
                key: /development/crossplane/ovh-minio
                property: AWS_SECRET_ACCESS_KEY