suite: test if the settings for the ovh-external-secret are correct
capabilities:
  apiVersions:
  - external-secrets.io/v1/ExternalSecret
release:
  name: external-secrets
templates:
- templates/ovh-external-secret.yaml
tests:
- it: ovh external secret is not rendered for local cluster
  values:
  - ../values-subchart-overrides.yaml
  - ../values-local.yaml
  asserts:
  - hasDocuments:
      count: 0
- it: ovh external secret is not rendered for development cluster without ovh values
  values:
  - ../values-subchart-overrides.yaml
  - ../values-development.yaml
  asserts:
  - hasDocuments:
      count: 0
- it: ovh external secret is not rendered for production cluster
  values:
  - ../values-subchart-overrides.yaml
  - ../values-production.yaml
  asserts:
  - hasDocuments:
      count: 0
- it: snapshot test for detecting side effects on ovh-external-secret during local development
  values:
  - ../values-subchart-overrides.yaml
  - ../values-development.yaml
  - ../values-sf-k8s04-dev.yaml
  asserts:
  - matchSnapshot: {}
- it: target secret name is set to the name of ovh secret
  values:
  - ../values-subchart-overrides.yaml
  - ../values-development.yaml
  - ../values-sf-k8s04-dev.yaml
  asserts:
  - equal:
      path: spec.target.name
      value: ovh
- it: refresh interval is set to one hour
  values:
  - ../values-subchart-overrides.yaml
  - ../values-development.yaml
  - ../values-sf-k8s04-dev.yaml
  asserts:
  - equal:
      path: spec.refreshInterval
      value: 1h
- it: secret store reference is set to awssm-parameter-store
  values:
  - ../values-subchart-overrides.yaml
  - ../values-development.yaml
  - ../values-sf-k8s04-dev.yaml
  asserts:
  - equal:
      path: spec.secretStoreRef
      value:
        kind: ClusterSecretStore
        name: awssm-parameter-store
- it: data for sf-k8s04-dev cluster is referencing the correct key(s)
  values:
  - ../values-subchart-overrides.yaml
  - ../values-development.yaml
  - ../values-sf-k8s04-dev.yaml
  asserts:
  - equal:
      path: spec.data
      value:
      - secretKey: creds
        remoteRef:
          key: /development/crossplane/ovh
