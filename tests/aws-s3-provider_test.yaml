suite: test if values for aws s3 provider are correct
capabilities:
  apiVersions:
  - pkg.crossplane.io/v1
templates:
- templates/aws-s3-provider.yaml
release:
  name: crossplane
tests:
- it: aws s3 provider is not rendered for sf-k8s04-dev cluster
  values:
  - &subchartOverrideValuesFile ../values-subchart-overrides.yaml
  - ../values-development.yaml
  - ../values-sf-k8s04-dev.yaml
  asserts:
  - hasDocuments:
      count: 0
- it: aws-s3-provider container image for local cluster
  values:
  - *subchartOverrideValuesFile
  - ../values-local.yaml
  asserts:
  - matchRegex: &packageRegex
      path: spec.package
      pattern: "^xpkg.upbound.io/upbound/provider-aws-s3:"
  - matchSnapshot: {}
- it: aws-s3-provider container image for development cluster
  values:
  - *subchartOverrideValuesFile
  - ../values-development.yaml
  asserts:
  - matchRegex: *packageRegex
  - matchSnapshot: {}
- it: aws-s3-provider container image for production cluster
  values:
  - *subchartOverrideValuesFile
  - ../values-production.yaml
  asserts:
  - matchRegex: *packageRegex
  - matchSnapshot: {}
