suite: test if values for aws s3 provider are correct
capabilities:
  apiVersions:
  - pkg.crossplane.io/v1
templates:
- templates/aws-s3-provider.yaml
release:
  name: crossplane
tests:
- it: uses the upbound provider-aws-s3 package on local
  values:
  - ../values-subchart-overrides.yaml
  - ../values-local.yaml
  asserts:
  - matchRegex: &packageRegex
      path: spec.package
      pattern: "^xpkg.upbound.io/upbound/provider-aws-s3:"
  - matchSnapshot: {}
- it: uses the upbound provider-aws-s3 package in development
  values:
  - ../values-subchart-overrides.yaml
  - ../values-development.yaml
  asserts:
  - matchRegex: *packageRegex
  - matchSnapshot: {}
- it: uses the upbound provider-aws-s3 package in production
  values:
  - ../values-subchart-overrides.yaml
  - ../values-production.yaml
  asserts:
  - matchRegex: *packageRegex
  - matchSnapshot: {}
