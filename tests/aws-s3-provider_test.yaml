suite: aws-s3 Provider package per stage
capabilities:
  apiVersions:
  - pkg.crossplane.io/v1
templates:
- templates/aws-s3-provider.yaml
release:
  name: crossplane
tests:
- it: renders nothing on sf-k8s04-dev where aws s3 is disabled
  values:
  - &subchartOverrideValuesFile ../values-subchart-overrides.yaml
  - ../values-development.yaml
  - ../values-sf-k8s04-dev.yaml
  asserts:
  - hasDocuments:
      count: 0
- it: uses the upbound provider-aws-s3 package on local
  values:
  - *subchartOverrideValuesFile
  - ../values-local.yaml
  asserts:
  - matchRegex: &providerPackageAssert
      path: spec.package
      pattern: "^xpkg.upbound.io/upbound/provider-aws-s3:"
  - matchSnapshot: {}
- it: uses the upbound provider-aws-s3 package in development
  values:
  - *subchartOverrideValuesFile
  - ../values-development.yaml
  asserts:
  - matchRegex: *providerPackageAssert
  - matchSnapshot: {}
- it: uses the upbound provider-aws-s3 package in production
  values:
  - *subchartOverrideValuesFile
  - ../values-production.yaml
  asserts:
  - matchRegex: *providerPackageAssert
  - matchSnapshot: {}
