suite: minio provider DeploymentRuntimeConfig resources for hetzner
templates:
  - templates/minio-s3-provider-runtime-config.yaml
release:
  name: crossplane
tests:
  - it: renders nothing on local without hetzner values
    capabilities:
      apiVersions: []
    values:
      - &subchartOverrideValuesFile ../values-subchart-overrides.yaml
      - ../values-local.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing in development without hetzner values
    capabilities:
      apiVersions: []
    values:
      - *subchartOverrideValuesFile
      - ../values-development.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing in production without hetzner values
    capabilities:
      apiVersions: []
    values:
      - *subchartOverrideValuesFile
      - ../values-production.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: sets non-zero cpu and memory requests and limits for the minio provider on sf-k8s03-dev
    capabilities:
      apiVersions:
        - pkg.crossplane.io/v1beta1
    values:
      - *subchartOverrideValuesFile
      - ../values-development.yaml
      - ../values-sf-k8s03-dev.yaml
    asserts:
      - matchRegex:
          path: spec.deploymentTemplate.spec.template.spec.containers[?(@.name == "package-runtime")].resources.limits.cpu
          # on sf-k8s03-dev cluster we expect non 0 cpu limits
          pattern: "^[1-9].*"
      - matchRegex:
          path: spec.deploymentTemplate.spec.template.spec.containers[?(@.name == "package-runtime")].resources.limits.memory
          # on sf-k8s03-dev cluster we expect non 0 memory limits
          pattern: "^[1-9].*"
      - matchRegex:
          path: spec.deploymentTemplate.spec.template.spec.containers[?(@.name == "package-runtime")].resources.requests.cpu
          # on sf-k8s03-dev cluster we expect non 0 cpu requests
          pattern: "^[1-9].*"
      - matchRegex:
          path: spec.deploymentTemplate.spec.template.spec.containers[?(@.name == "package-runtime")].resources.requests.memory
          # on sf-k8s03-dev cluster we expect non 0 memory requests
          pattern: "^[1-9].*"
      - matchSnapshot: {}
