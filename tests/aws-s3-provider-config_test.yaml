suite: aws-s3 ProviderConfig assume role chain per stage
capabilities:
  apiVersions:
  - aws.upbound.io/v1beta1
templates:
- templates/aws-s3-provider-config.yaml
release:
  name: crossplane
tests:
- it: assumes the development s3 access role on local
  values:
  - ../values-subchart-overrides.yaml
  - ../values-local.yaml
  asserts:
  - contains: &developmentS3AccessRoleAssert
      path: spec.assumeRoleChain
      content:
        roleARN: arn:aws:iam::737742117295:role/assume_s3_access
  - matchSnapshot: {}
- it: assumes the development s3 access role in development
  values:
  - ../values-subchart-overrides.yaml
  - ../values-development.yaml
  asserts:
  - contains: *developmentS3AccessRoleAssert
  - matchSnapshot: {}
- it: assumes the production s3 access role in production
  values:
  - ../values-subchart-overrides.yaml
  - ../values-production.yaml
  asserts:
  - contains:
      path: spec.assumeRoleChain
      content:
        roleARN: arn:aws:iam::065204381364:role/assume_s3_access
  - matchSnapshot: {}
